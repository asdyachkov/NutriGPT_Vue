<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="pattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      
      <!-- Circles -->
      <circle cx="100" cy="100" r="80" stroke="#1A6B4B" stroke-width="1.5" opacity="0.04"></circle>
      <circle cx="0" cy="0" r="80" stroke="#1A6B4B" stroke-width="1.5" opacity="0.04"></circle>
      <circle cx="200" cy="0" r="80" stroke="#1A6B4B" stroke-width="1.5" opacity="0.04"></circle>
      <circle cx="0" cy="200" r="80" stroke="#1A6B4B" stroke-width="1.5" opacity="0.04"></circle>
      <circle cx="200" cy="200" r="80" stroke="#1A6B4B" stroke-width="1.5" opacity="0.04"></circle>

      <!-- Connecting lines -->
      <line x1="0" y1="100" x2="200" y2="100" stroke="#1A6B4B" stroke-width="1" opacity="0.04"></line>
      <line x1="100" y1="0" x2="100" y2="200" stroke="#1A6B4B" stroke-width="1" opacity="0.04"></line>

      <!-- Diagonal accents -->
      <line x1="0" y1="0" x2="200" y2="200" stroke="#1A6B4B" stroke-width="1" opacity="0.03"></line>
      <line x1="200" y1="0" x2="0" y2="200" stroke="#1A6B4B" stroke-width="1" opacity="0.03"></line>

    </pattern>
  </defs>

  <rect width="400" height="400" fill="url(#pattern)"></rect>
</svg>